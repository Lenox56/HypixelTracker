services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Caddy sitzt davor und setzt X-Forwarded-For mit der echten Client-IP
      TRUST_PROXY_HEADERS: "true"
    # Kein Port nach aussen: erreichbar nur ueber Caddy (HTTPS)
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
